# 独立 workspace 边界：本 crate 只服务 CitizenWallet 冷端，不并入 citizenchain
# 链端 workspace（避免继承其 SDK 依赖与 lint 配置，也避免链端构建牵连冷钱包）。
[workspace]

[package]
name = "citizenwallet_signer"
version = "1.0.0"
edition = "2021"
authors = ["VoyagerRhett <chinanation@icloud.com>"]
repository = "https://github.com/crcfrcn/citizenwallet"
license = "MIT"
description = "CitizenWallet 冷钱包 sr25519 与 ML-DSA-65 离线签名库"

[lib]
path = "lib.rs"
# 冷钱包永久离线，仅链接账户签名能力，不链接节点或轻客户端。
crate-type = ["cdylib", "staticlib"]
name = "citizenwallet_signer"

[dependencies]
mldsa = { path = "../../citizenchain/runtime/transaction/mldsa", default-features = false, features = ["ffi"] }
schnorrkel = { version = "=0.11.5", default-features = false, features = ["preaudit_deprecated", "alloc", "getrandom"] }
zeroize = "=1.9.0"

[features]
operation = ["mldsa/pq-only"]

[profile.release]
opt-level = "z"        # 冷钱包体积优先
lto = true
codegen-units = 1
# 必须 unwind：citizen-signer 的 4 个 FFI 入口靠 `catch_unwind` 把内部 panic 兜成
# 错误码；`panic = "abort"` 下 catch_unwind 形同虚设，panic 直接 abort 掉 App，
# 「绝不 abort」的安全承诺就是假的。体积略增，换真实的 panic 兜底。
panic = "unwind"
# 磁盘产物保留符号+行号，原生崩溃栈才能反解到 Rust 源码行（留档即符号服务器）。
# APK/IPA 侧由各自打包配置分档剥离，策略与 CitizenApp 一致。
strip = false
debug = 1
