name: citizenwallet.android
on:
  workflow_dispatch:
concurrency:
  group: "${{ github.repository }}-android"
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
          components: rust-src, clippy
      - name: 准备本平台工具
        shell: bash
        run: |
          set -euo pipefail
          brew install bash
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.zip" https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.47.2-stable.zip
          echo 'f456fd6733053d9301828a2e702d6cbec872923126809aa8c48eb0a696d6cc01  '"$RUNNER_TEMP/flutter.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/flutter.zip" "$RUNNER_TEMP"
          {
            echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
            echo "JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_HOME=$HOME/Library/Android/sdk"
            echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk"
            echo "ANDROID_JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_SDK_HOME=$HOME/Library/Android/sdk"
            echo "PRODUCT_BASH_BIN=$(brew --prefix bash)/bin/bash"
            echo "PRODUCT_GIT_BIN=$(command -v git)"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
          if [ "android" = android ]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
            echo 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  '"$RUNNER_TEMP/gradle.zip" | shasum -a 256 --check
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            echo "CITIZENWALLET_GRADLE_BIN=$RUNNER_TEMP/gradle-9.1.0/bin/gradle" >> "$GITHUB_ENV"
            "$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.31.6'
            echo "ANDROID_NDK_HOME=$HOME/Library/Android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
            echo "$HOME/Library/Android/sdk/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          fi
      - name: 准备产品锁定的 Flutter Android 修订
        shell: bash
        run: node scripts/build.mjs ci-prepare-flutter android
      - name: 恢复 Android Cargo 增量缓存
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/cache/cargo/android
          key: citizenwallet-cargo-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenwallet-cargo-android-
      - name: 本 Runner 编译、签名并验收
        env:
          APP_KEY: "${{ secrets.APP_KEY }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_KEY"
          node scripts/build.mjs ci-build android > "$RUNNER_TEMP/citizenwallet-android-result.json"
      - name: 保存 Android Cargo 增量缓存
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/cache/cargo/android
          key: citizenwallet-cargo-android-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 创建并回读本平台正式 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          plan="$GITHUB_WORKSPACE/target/build/android/release-plan.json"
          tag="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.tag)' "$plan")"
          notes="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.notes)' "$plan")"
          assets="$GITHUB_WORKSPACE/target/build/android/release-assets"
          node scripts/build.mjs ci-create-release-tag android
          release_url="$(gh release create "$tag" "$assets"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "citizenwallet · android · $tag" --notes-file "$notes" --draft --latest=false)"
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/tag/"
          [[ "$release_url" == "$release_prefix"* ]]
          release_ref="${release_url#"$release_prefix"}"
          [[ "$release_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_ref" --jq '.id')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          node scripts/build.mjs ci-verify-release android draft "$release_id"
          node scripts/build.mjs ci-publish-release android "$release_id"
          node scripts/build.mjs ci-verify-release android published "$release_id"
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: |
          if [ -d "target/build/android" ]; then node scripts/build.mjs finish android; fi
  cleanup:
    if: always()
    needs: release
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: "${{ github.token }}"
      CITIZENWALLET_RELEASE_RESULT: "${{ needs.release.result }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b7965d048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 清理 Android 已完成 Run 与 Cargo 缓存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/build.mjs ci-cleanup android; then
            echo '::error::Android Run/Cargo 缓存清理失败；构建与 Release 结果保持原回执。'
            exit 1
          fi
