name: citizenwallet.ios
on:
  workflow_dispatch:
concurrency:
  group: "${{ github.repository }}-ios"
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios
          components: rust-src, clippy
      - name: 准备本平台工具
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | grep '^Xcode 27'
          brew install bash
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.zip" https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.47.2-stable.zip
          echo 'f456fd6733053d9301828a2e702d6cbec872923126809aa8c48eb0a696d6cc01  '"$RUNNER_TEMP/flutter.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/flutter.zip" "$RUNNER_TEMP"
          {
            echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
            echo "JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_HOME=$HOME/Library/Android/sdk"
            echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk"
            echo "ANDROID_JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_SDK_HOME=$HOME/Library/Android/sdk"
            echo "PRODUCT_BASH_BIN=$(brew --prefix bash)/bin/bash"
            echo "PRODUCT_GIT_BIN=$(command -v git)"
            clang="$(realpath "$(xcrun --find clang)")"
            test -f "$clang" && test -x "$clang" && test ! -L "$clang"
            echo "CC=$clang"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
          if [ "ios" = android ]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
            echo 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  '"$RUNNER_TEMP/gradle.zip" | shasum -a 256 --check
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            echo "CITIZENWALLET_GRADLE_BIN=$RUNNER_TEMP/gradle-9.1.0/bin/gradle" >> "$GITHUB_ENV"
            "$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager" 'build-tools;37.0.1' 'platforms;android-36' 'ndk;28.2.13676358'
          fi
      - name: 恢复 iOS Cargo 增量缓存
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/cache/cargo/ios
          key: citizenwallet-cargo-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenwallet-cargo-ios-
      - name: 本 Runner 编译、签名并验收
        env:
          IOS_KEY: "${{ secrets.IOS_KEY }}"
          IOS_PROVISIONING_PROFILE: "${{ secrets.WALLET_PROFILE }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOS_KEY" && test -n "$IOS_PROVISIONING_PROFILE"
          node scripts/build.mjs ci-build ios > "$RUNNER_TEMP/citizenwallet-ios-result.json"
      - name: 保存 iOS Cargo 增量缓存
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: target/cache/cargo/ios
          key: citizenwallet-cargo-ios-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 创建并回读本平台正式 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          plan="$GITHUB_WORKSPACE/target/build/ios/release-plan.json"
          tag="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.tag)' "$plan")"
          version="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.version)' "$plan")"
          notes="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.notes)' "$plan")"
          assets="$GITHUB_WORKSPACE/target/build/ios/release-assets"
          node scripts/build.mjs ci-create-release-tag ios
          release_url="$(gh release create "$tag" "$assets"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "公民钱包 · ios-v$version" --notes-file "$notes" --draft --latest=false)"
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/tag/"
          [[ "$release_url" == "$release_prefix"* ]]
          release_ref="${release_url#"$release_prefix"}"
          [[ "$release_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_ref" --jq '.id')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          node scripts/build.mjs ci-verify-release ios draft "$release_id"
          node scripts/build.mjs ci-publish-release ios "$release_id"
          node scripts/build.mjs ci-verify-release ios published "$release_id"
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: |
          if [ -d "target/build/ios" ]; then node scripts/build.mjs finish ios; fi
  cleanup:
    if: always()
    needs: release
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      CITIZENWALLET_RELEASE_RESULT: "${{ needs.release.result }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 清理 iOS 旧 Release、Run 与 Cargo 缓存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/build.mjs ci-retain-releases ios; then
            echo '::error::iOS Release/Tag 清理失败；不能报告记录清理成功。'
            exit 1
          fi
          if ! node scripts/build.mjs ci-cleanup ios; then
            echo '::error::iOS Run/Cargo 缓存清理失败；构建与 Release 结果保持原回执。'
            exit 1
          fi
