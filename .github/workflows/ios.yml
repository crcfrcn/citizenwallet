# 产品自己的唯一自动化工作流；配置文件不执行编译或GitHub操作。
name: 公民钱包·iOS
run-name: 公民钱包·iOS·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: citizenwallet-ios
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: ios
  PRODUCT_WORK: ${{ github.workspace }}/target/build/${{ github.run_id }}-${{ github.run_attempt }}
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  version:
    name: 公民钱包·iOS·版本
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '25.2.1'
          check-latest: false
      - id: version
        name: 计算本Run版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" > "$RUNNER_TEMP/previous.json"
          node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let version=/^version:\s*([^+\s]+)/mu.exec(readFileSync('pubspec.yaml','utf8'))[1];
          const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/previous.json','utf8')).workflow_runs[0];
          if(previous){
            const data=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+previous.id+'/artifacts?per_page=100'],{encoding:'utf8'}));
            const prefix="公民钱包·iOS·v";
            const artifact=data.artifacts.find(value=>value.name.startsWith(prefix)&&/^\d+\.\d+\.\d+$/u.test(value.name.slice(prefix.length)));
            const parts=artifact.name.slice(prefix.length).split('.');parts[2]=String(BigInt(parts[2])+1n);version=parts.join('.');
          }
          console.log('version='+version);
          NODE
  compile:
    needs: version
    name: 公民钱包·iOS·v${{ needs.version.outputs.version }}
    env:
      PRODUCT_VERSION: ${{ needs.version.outputs.version }}
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenwallet'
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 恢复官方缓存
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache
          key: citizenwallet-ios-official-25.2.1-1.97.1-3.47.2-${{ hashFiles('pubspec.lock', 'Podfile.lock', 'signing/Cargo.lock', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenwallet-ios-official-25.2.1-1.97.1-3.47.2-${{ hashFiles('pubspec.lock', 'Podfile.lock', 'signing/Cargo.lock', 'package-lock.json') }}-
      - name: 核对官方Xcode
        run: |
          set -euo pipefail
          xcodebuild -version | grep '^Xcode 27'
      - name: 真实代码回归与严格分析
        run: |
          node scripts/build.mjs test "$PLATFORM"
      - name: 准备本轮正式Apple签名
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          CITIZENWALLET_PROFILE: ${{ secrets.CITIZENWALLET_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRODUCT_WORK/signing"
          python3 - <<'PY'
          import os,pathlib,base64,re
          p=pathlib.Path(os.environ['PRODUCT_WORK'])/'signing';fields={}
          for raw in os.environ['IOS_KEY'].splitlines():
           line=raw.strip()
           if not line or line.startswith('#'):continue
           key,sep,value=line.partition('=')
           if not sep or not value or key in fields:raise ValueError('IOS_KEY字段无效')
           fields[key]=value
          if set(fields)!={'pkcs12','password','certificate_sha1'} or not re.fullmatch('[0-9A-F]{40}',fields['certificate_sha1']):raise ValueError('正式证书字段无效')
          (p/'distribution.p12').write_bytes(base64.b64decode(fields['pkcs12'],validate=True));(p/'password').write_text(fields['password']);(p/'certificate').write_text(fields['certificate_sha1']);(p/'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['CITIZENWALLET_PROFILE'],validate=True))
          PY
          security list-keychains -d user > "$PRODUCT_WORK/signing/keychains"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keychain="$PRODUCT_WORK/signing/release.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$PRODUCT_WORK/signing/distribution.p12" -k "$keychain" -P "$(cat "$PRODUCT_WORK/signing/password")" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security cms -D -i "$PRODUCT_WORK/signing/profile.mobileprovision" > "$PRODUCT_WORK/signing/profile.plist"
          python3 - <<'PY'
          import os,pathlib,plistlib,datetime,hashlib,shlex,subprocess,shutil
          p=pathlib.Path(os.environ['PRODUCT_WORK'])/'signing';certificate=(p/'certificate').read_text();profile=plistlib.loads((p/'profile.plist').read_bytes());entitlements=profile['Entitlements']
          if profile['TeamIdentifier']!=['MHYMVRN6FC'] or entitlements.get('application-identifier')!='MHYMVRN6FC.ios.citizenwallet' or entitlements.get('get-task-allow') is not False:raise ValueError('正式描述文件身份不符')
          if profile['ExpirationDate']<=datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):raise ValueError('正式描述文件已过期')
          if certificate not in [hashlib.sha1(value).hexdigest().upper()for value in profile['DeveloperCertificates']]:raise ValueError('正式证书不属于描述文件')
          original=shlex.split((p/'keychains').read_text());subprocess.run(['security','list-keychains','-d','user','-s',str(p/'release.keychain-db'),*original],check=True)
          destination=pathlib.Path.home()/'Library/MobileDevice/Provisioning Profiles'/(profile['UUID']+'.mobileprovision');destination.parent.mkdir(parents=True,exist_ok=True)
          if destination.exists():raise ValueError('描述文件位置已占用')
          (p/'installed-profile').write_text(str(destination));shutil.copyfile(p/'profile.mobileprovision',destination)
          export={'method':'release-testing'if profile.get('ProvisionedDevices')else'app-store-connect','teamID':'MHYMVRN6FC','signingStyle':'manual','signingCertificate':certificate,'provisioningProfiles':{'ios.citizenwallet':profile['UUID']}}
          (p/'export.plist').write_bytes(plistlib.dumps(export))
          with open(os.environ['GITHUB_ENV'],'a')as f:f.write('IOS_EXPORT_OPTIONS='+str(p/'export.plist')+'\nIOS_PROFILE_UUID='+profile['UUID']+'\nIOS_SIGNING_CERTIFICATE='+certificate+'\n')
          PY
      - name: 编译本平台正式产物
        run: |
          node scripts/build.mjs build "$PLATFORM"
      - name: 验收正式IPA
        run: |
          set -euo pipefail
          phase='解包正式IPA'
          trap 'printf "IPA验收失败：%s，第%s行\n" "$phase" "$LINENO" >&2' ERR
          name="$(node --input-type=module -e 'import {artifactBaseName} from "./scripts/build.mjs"; console.log(artifactBaseName(process.env.PLATFORM,process.env.PRODUCT_VERSION));')"
          unzip -q "$PRODUCT_WORK/artifact/$name.ipa" -d "$PRODUCT_WORK/verify"
          apps=("$PRODUCT_WORK"/verify/Payload/*.app)
          phase='唯一应用'
          test "${#apps[@]}" = 1
          app="${apps[0]}"
          phase='签名完整性'
          codesign --verify --deep --strict "$app"
          phase='应用标识'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = ios.citizenwallet
          phase='版本号'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$PRODUCT_VERSION"
          phase='构建号'
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$GITHUB_RUN_NUMBER"
          phase='签名信息'
          codesign -dv --verbose=4 "$app" 2> "$PRODUCT_WORK/signing/verified.txt"
          phase='签名团队'
          grep -Fxq TeamIdentifier=MHYMVRN6FC "$PRODUCT_WORK/signing/verified.txt"
          phase='读取导出符号'
          nm -g "$app/Runner" > "$PRODUCT_WORK/exports.txt"
          for symbol in derive_hard public_key sign verify; do phase="导出符号：$symbol"; grep -Eq "[[:space:]]_citizen_sr25519_${symbol}$" "$PRODUCT_WORK/exports.txt"; done
      - name: 装配并核对正式附件
        run: |
          node scripts/build.mjs package "$PLATFORM"
      - name: 公民钱包·iOS·v${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民钱包·iOS·v${{ needs.version.outputs.version }}
          path: ${{ env.PRODUCT_WORK }}/artifact/*
          if-no-files-found: error
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民钱包·iOS·v$PRODUCT_VERSION"
          encoded="$(printf '%s' "$name" | jq -sRr @uri)"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const proof=JSON.parse(readFileSync(process.env.PRODUCT_WORK+'/proof.json'));
          writeFileSync(process.env.PRODUCT_WORK+'/notes.md','<!-- automation:'+JSON.stringify(proof)+' -->\n');
          JS
          created_tag=0
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$created_tag" = 1 ]; then
              if gh release view "$name" --repo "$GITHUB_REPOSITORY" --json body > "$PRODUCT_WORK/rollback.json"; then
                if jq -er --arg id "$GITHUB_RUN_ID" '.body|capture("automation:(?<proof>[^\n]*) -->").proof|fromjson|select(.run_id==($id|tonumber))' "$PRODUCT_WORK/rollback.json" >/dev/null; then
                  gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo '本轮正式候选撤销失败' >&2
                fi
              else
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本轮Tag撤销失败' >&2
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$PRODUCT_WORK/tag.json"
          created_tag=1
          assets=("$PRODUCT_WORK"/artifact/*)
          # 官方file#label语法保留中文显示名，实际附件文件名不触发GitHub重命名。
          uploads=()
          for file in "${assets[@]}"; do uploads+=("$file#$name.${file##*.}"); done
          gh release create "$name" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --draft --title "$name" --notes-file "$PRODUCT_WORK/notes.md"
          mkdir "$PRODUCT_WORK/readback"
          gh release download "$name" --repo "$GITHUB_REPOSITORY" --dir "$PRODUCT_WORK/readback"
          for file in "${assets[@]}"; do cmp "$file" "$PRODUCT_WORK/readback/$(basename "$file")"; done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" > "$PRODUCT_WORK/release.json"
          jq -e --arg name "$name" --arg sha "$GITHUB_SHA" --argjson count 3 '.name==$name and .tag_name==$name and .target_commitish==$sha and .draft==false and .prerelease==false and (.assets|length)==$count' "$PRODUCT_WORK/release.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
      # 与公民App一致：同一Run验收交付成功后上传同一份IPA，不提交审核或上架。
      - name: 上传正式IPA到App Store Connect
        timeout-minutes: 30
        env:
          APPSTORE_KEYID: ${{ secrets.APPSTORE_KEYID }}
          APPSTORE_ISSUERID: ${{ secrets.APPSTORE_ISSUERID }}
          APPSTORE_PRIVATEKEY: ${{ secrets.APPSTORE_PRIVATEKEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPSTORE_KEYID:?缺少APPSTORE_KEYID}"
          : "${APPSTORE_ISSUERID:?缺少APPSTORE_ISSUERID}"
          : "${APPSTORE_PRIVATEKEY:?缺少APPSTORE_PRIVATEKEY}"
          export API_PRIVATE_KEYS_DIR="$PRODUCT_WORK/signing/appstore"
          mkdir "$API_PRIVATE_KEYS_DIR"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s\n' "$APPSTORE_PRIVATEKEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEYID.p8"
          ipa="$(node --input-type=module -e 'import {artifactBaseName} from "./scripts/build.mjs"; process.stdout.write(artifactBaseName("ios",process.env.PRODUCT_VERSION)+".ipa");')"
          xcrun altool --upload-package "$PRODUCT_WORK/artifact/$ipa" \
            --api-key "$APPSTORE_KEYID" --api-issuer "$APPSTORE_ISSUERID" \
            --wait --output-format json
      - name: 保存官方缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: target/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: 清理本轮现场与签名输入
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,shlex,subprocess,shutil
          p=pathlib.Path(os.environ['PRODUCT_WORK']);signing=p/'signing'
          if (signing/'keychains').exists():subprocess.run(['security','list-keychains','-d','user','-s',*shlex.split((signing/'keychains').read_text())],check=True)
          if (signing/'release.keychain-db').exists():subprocess.run(['security','delete-keychain',str(signing/'release.keychain-db')],check=True)
          if (signing/'installed-profile').exists():pathlib.Path((signing/'installed-profile').read_text()).unlink(missing_ok=True)
          if p.exists():shutil.rmtree(p)
          PY
  cleanup:
    name: 公民钱包·iOS·收尾
    needs: [version, compile]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: 保留本平台最新版本、成功失败记录和缓存
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.version.result == 'success' && needs.compile.result == 'success' && 'success' || 'failure' }}
          PREFIX: 公民钱包·iOS·v
          CACHE_PREFIX: citizenwallet-ios-
        run: |
          set -euo pipefail
          workflow="${GITHUB_WORKFLOW_REF%@*}"; workflow="${workflow##*/}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > "$RUNNER_TEMP/caches.json"
          jq -r --arg prefix "$CACHE_PREFIX" '[.[].actions_caches[]|select(.ref=="refs/heads/main" and (.key|startswith($prefix)))]|sort_by(.created_at,.id)|reverse|.[1:][]|.id' "$RUNNER_TEMP/caches.json" |
          while IFS= read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
          if [ "$RESULT" = success ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            jq -r --arg prefix "$PREFIX" '[.[][]|select(.draft==false and (.tag_name|startswith($prefix)))]|sort_by(.published_at,.id)|reverse|.[1:][]|.tag_name' "$RUNNER_TEMP/releases.json" |
            while IFS= read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"
          jq --argjson current "$GITHUB_RUN_ID" --arg result "$RESULT" '
            [.[].workflow_runs[]|select(.status=="completed" or .id==$current)|
             .+{state:(if .id==$current then $result elif .conclusion=="success" then "success" else "failure" end)}]|
            group_by(.state)|map(sort_by(.run_number)|last.id)' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/keep.json"
          jq -r --argjson current "$GITHUB_RUN_ID" --slurpfile keep "$RUNNER_TEMP/keep.json" '
            [.[].workflow_runs[]|select(.status=="completed" and .id!=$current)|select(.id as $id|$keep[0]|index($id)|not)]|
            sort_by(.conclusion=="success",.run_number)[]|.id' "$RUNNER_TEMP/runs.json" |
          while IFS= read -r id; do gh run delete "$id" --repo "$GITHUB_REPOSITORY"; done
